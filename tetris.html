<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Tetris</title>
<style>
  canvas { background: #000; display: block; margin: 0 auto; }
</style>
</head>
<body>
<canvas id="game" width="200" height="400"></canvas>
<script>
const canvas = document.getElementById('game');
const context = canvas.getContext('2d');
const grid = 20; // block size
const cols = canvas.width / grid;
const rows = canvas.height / grid;

// board matrix
let board = Array.from({length: rows}, () => Array(cols).fill(0));

// pieces definitions
const pieces = [
  {shape: [[1,1,1,1]], color: 'cyan'}, // I
  {shape: [[0,0,1],[1,1,1]], color: 'blue'}, // J
  {shape: [[1,0,0],[1,1,1]], color: 'orange'}, // L
  {shape: [[1,1],[1,1]], color: 'yellow'}, // O
  {shape: [[0,1,1],[1,1,0]], color: 'green'}, // S
  {shape: [[0,1,0],[1,1,1]], color: 'purple'}, // T
  {shape: [[1,1,0],[0,1,1]], color: 'red'} // Z
];

function rotate(matrix) {
  // rotate matrix 90 degrees
  return matrix[0].map((_, i) => matrix.map(row => row[i]).reverse());
}

function randomPiece() {
  const p = pieces[Math.floor(Math.random()*pieces.length)];
  return {matrix: p.shape.map(r => r.slice()), color: p.color, x: Math.floor(cols/2)-1, y: 0};
}

let piece = randomPiece();
let dropCounter = 0;
let dropInterval = 1000; // ms
let lastTime = 0;

function collide(board, piece) {
  const m = piece.matrix;
  const o = {x: piece.x, y: piece.y};
  for (let y = 0; y < m.length; ++y) {
    for (let x = 0; x < m[y].length; ++x) {
      if (m[y][x] !== 0 &&
          (board[y + o.y] && board[y + o.y][x + o.x]) !== 0) {
        return true;
      }
    }
  }
  return false;
}

function merge(board, piece) {
  piece.matrix.forEach((row, y) => {
    row.forEach((value, x) => {
      if (value !== 0) {
        board[y + piece.y][x + piece.x] = piece.color;
      }
    });
  });
}

function clearLines() {
  outer: for (let y = board.length -1; y >=0; --y) {
    for (let x = 0; x < board[y].length; ++x) {
      if (board[y][x] === 0) {
        continue outer;
      }
    }
    const row = board.splice(y, 1)[0].fill(0);
    board.unshift(row);
    ++y;
  }
}

function drawMatrix(matrix, offset, color) {
  matrix.forEach((row, y) => {
    row.forEach((value, x) => {
      if (value !== 0) {
        context.fillStyle = color;
        context.fillRect((x + offset.x) * grid, (y + offset.y) * grid, grid-1, grid-1);
      }
    });
  });
}

function draw() {
  context.clearRect(0, 0, canvas.width, canvas.height);
  drawMatrix(board, {x:0, y:0}, null);
  for(let y=0; y<board.length; y++) {
    for(let x=0; x<board[y].length; x++) {
      if (board[y][x] !== 0) {
        context.fillStyle = board[y][x];
        context.fillRect(x*grid, y*grid, grid-1, grid-1);
      }
    }
  }
  drawMatrix(piece.matrix, {x: piece.x, y: piece.y}, piece.color);
}

function drop() {
  piece.y++;
  if (collide(board, piece)) {
    piece.y--;
    merge(board, piece);
    clearLines();
    piece = randomPiece();
    if (collide(board, piece)) {
      board.forEach(row => row.fill(0));
      alert('Game Over');
    }
  }
  dropCounter = 0;
}

function update(time=0) {
  const delta = time - lastTime;
  lastTime = time;
  dropCounter += delta;
  if (dropCounter > dropInterval) {
    drop();
  }
  draw();
  requestAnimationFrame(update);
}

function move(dir) {
  piece.x += dir;
  if (collide(board, piece)) {
    piece.x -= dir;
  }
}

document.addEventListener('keydown', event => {
  if (event.keyCode === 37) {
    move(-1);
  } else if (event.keyCode === 39) {
    move(1);
  } else if (event.keyCode === 40) {
    drop();
  } else if (event.keyCode === 38) {
    const rotated = rotate(piece.matrix);
    const x = piece.x;
    piece.x = Math.min(piece.x, cols - rotated[0].length);
    piece.matrix = rotated;
    if (collide(board, piece)) {
      piece.matrix = rotate(rotate(rotate(rotated))); // rotate back
      piece.x = x;
    }
  }
});

update();
</script>
</body>
</html>
